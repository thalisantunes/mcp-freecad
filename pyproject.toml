[project]
name = "mcp-freecad"
version = "0.1.0"
description = "MCP server para FreeCAD headless (freecadcmd): inspeção, conversão e perfis 2D para impressão 3D e corte a laser"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thalis Antunes" }]
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
mcp-freecad = "mcp_freecad.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_freecad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: roda o freecadcmd de verdade (pula se o FreeCAD não for encontrado)"]
